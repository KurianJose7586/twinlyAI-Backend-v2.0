version: 1.0
runtime: docker

# AWS App Runner configuration
# This file is used when creating the service manually via the AWS Console.
# The GitHub Actions workflow (deploy-aws.yml) handles automated deploys.

build:
  commands:
    build:
      - echo "Using pre-built Docker image from ECR"

run:
  runtime-version: "3.11"
  command: uvicorn app.main:app --host 0.0.0.0 --port 7860
  network:
    port: 7860
    env: APP_PORT
  env:
    - name: ENV
      value: prod
